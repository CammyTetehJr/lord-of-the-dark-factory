[project]
name = "lord-of-the-dark-factory"
version = "0.1.0"
description = "Confidence layer for autonomous bug resolution"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "openai==1.59.7",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools]
packages = ["factory", "factory.stations", "factory.fixers"]

[tool.setuptools.package-data]
factory = ["dev_repro/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
